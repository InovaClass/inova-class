name: inova-class

services:
  database:
    image: postgres:18
    env_file: ../../.env.development
    ports:
      - '5432:5432'
    volumes:
      - database:/var/lib/postgresql

  mail:
    image: axllent/mailpit:v1
    ports:
      - '1025:1025'
      - '8025:8025'

  redis:
    image: redis:8
    ports:
      - '6379:6379'

volumes:
  database:
